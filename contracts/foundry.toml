[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The deploy script writes the deployed addresses here.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
# A handler that reverts is a rejected action, not a broken invariant.
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
# Two rules are excluded because they only fire on test code, where they are intentional: tests call
# token.transfer without reading the return value (they assert on balances), and tests and scripts
# use cheatcodes by design. Every other rule stays on, for src as well.
exclude_lints = ["erc20-unchecked-transfer", "unsafe-cheatcode"]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
