# harness-kit v0.9.0 - installed copy. Edit in harness-kit, then re-install.
# Money/on-chain zone gate. A separate workflow on purpose: it re-runs when a
# label is added (types: labeled) without re-running the full CI. ~15 s per run.
name: Harness gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  zone-review:
    name: Independent review on risk zones
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check review label for zone changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: python3 -I scripts/harness/zonegate.py "$BASE_SHA" "$LABELS"
