name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The db package attacks its SQL guards on real Postgres, one fresh database per test file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bridge" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DB_TEST_ADMIN_URL: postgresql://bridge:bridge@localhost:5434/postgres
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      # The chain package deploys the contracts to a real Anvil in its tests, so it needs the
      # Solidity libraries (submodules) and Foundry, same release as the local stack.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the contracts (the chain tests deploy from the build output)
        working-directory: contracts
        run: forge build

      - name: Committed ABIs match the Foundry build
        run: pnpm --filter @bridge/chain abi:check

      - name: Unit and integration tests with coverage
        run: pnpm test:cov

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # forge-std and OpenZeppelin are git submodules. Their own nested submodules are not needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      # Same Foundry release as the local development stack in docker-compose.yml.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test (unit, fuzz and invariant)
        working-directory: contracts
        run: forge test -vvv

      # Fuzz and invariant gas varies run to run, so the snapshot covers the deterministic tests.
      # Runs the deployment promotion script against its own Anvil (about 15 seconds).
      - name: Deployment promotion script
        run: bash contracts/script/test-promote.sh

      - name: Gas snapshot has not regressed
        working-directory: contracts
        run: forge snapshot --check --no-match-test "testFuzz|invariant"

      - name: Coverage
        working-directory: contracts
        run: forge coverage --report summary --no-match-coverage "(test|script)"
