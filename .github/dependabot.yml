# Dependency updates. One weekly PR per ecosystem for minor and patch bumps; majors arrive one per
# PR so each can be read on its own.
#
# Not covered: the Solidity libraries (forge-std, OpenZeppelin) are git submodules under
# contracts/lib, pinned to exact commits and updated by hand with `forge install` / a submodule
# bump, followed by the full Foundry suite and the ABI check.
version: 2
updates:
  - package-ecosystem: npm
    # The pnpm workspace root: one lockfile covers every package and app.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Major versions are never proposed automatically: each is a deliberate migration (for example
    # NestJS 12 is ESM-only while this workspace is CommonJS, Prisma 7 changes client generation,
    # @types/node must follow the minimum runtime, Node 20). Minor and patch updates still arrive
    # grouped. To take a major, bump it by hand in its own pull request.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
