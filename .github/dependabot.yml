# Dependency updates. One weekly PR per ecosystem for minor and patch bumps; majors arrive one per
# PR so each can be read on its own.
#
# Not covered: the Solidity libraries (forge-std, OpenZeppelin) are git submodules under
# contracts/lib, pinned to exact commits and updated by hand with `forge install` / a submodule
# bump, followed by the full Foundry suite and the ABI check.
version: 2
updates:
  - package-ecosystem: npm
    # The pnpm workspace root: one lockfile covers every package and app.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Held back on purpose, each a planned migration rather than a routine bump:
    # - NestJS 12 is ESM-only; this workspace is CommonJS (ts-jest, ts-node). The three packages
    #   must move together.
    # - TypeScript 6 changes compiler defaults and needs typescript-eslint and ts-jest to follow.
    # - @types/node must follow the minimum supported runtime (Node 20), not the newest Node.
    # - Prisma 7 changes client generation and configuration; the db package and its SQL guards
    #   need a planned migration and a full re-run of their tests.
    # Remove an entry here when that migration is scheduled.
    ignore:
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
